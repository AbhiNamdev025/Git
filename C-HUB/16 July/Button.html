<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buttons</title>
    <link rel="stylesheet" href="Button.css" />
  </head>
  <body>
    <h2>Different Types of Buttons</h2>

    <div class="buttons">
      <div style="display: flex; justify-content: space-evenly; width: 90vw">
        <div class="button Primary"><button>Primary</button></div>
        <div class="button Secondary"><button>Secondary</button></div>
        <div class="button Outline"><button>Outline</button></div>
        <div class="button Danger"><button>Danger</button></div>
        <div class="button Success"><button>Success</button></div>
        <div class="button Ghost"><button>Ghost</button></div>
        <div class="button Icon"><button>🎶</button></div>
        <div class="button Rounded"><button>Rounded</button></div>
      </div>
      <div class="button Block"><button>Block (Full Width)</button></div>
    </div>
  </body>
</html>

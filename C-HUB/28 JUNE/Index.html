<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veltrixa AI Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-black via-gray-900 to-purple-900 min-h-screen flex items-center justify-center px-4">
    <div
        class="w-full max-w-md bg-gradient-to-br from-black via-gray-900 to-purple-900 text-white rounded-2xl shadow-lg p-6">
        <!-- Logo -->
        <div class="text-center mb-4">
            <img src="https://veltrixa.ai/images/logo.png" alt="Veltrixa AI Logo" class="h-10 mx-auto mb-2" />
            <h2 class="text-2xl font-semibold">Welcome! <span class="text-purple-400">Latest</span></h2>
            <p class="text-sm text-gray-300">Enter Your Details Below To Sign Up</p>

        </div>
        <br>

        <!-- Form -->
        <form class="space-y-4">
            <!-- Referral Node -->
            <div>
                <label class="block text-sm font-medium mb-1">Referral Node <span class="text-green-400 font-semibold">✔
                        Valid</span></label>
                <input type="text" value="VT791492" disabled
                    class="w-full bg-gray-800 border border-gray-600 text-gray-300 rounded-lg px-3 py-2 cursor-not-allowed" />
            </div>

            <!-- Full Name -->
            <input type="text" placeholder="Full Name"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm" required />

            <!-- Email -->
            <input type="email" placeholder="Email Address"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm" required />

            <!-- Phone Number -->
            <div class="flex items-center gap-2">
                <select class="bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white" required>
                    <option value="+44" selected>🇬🇧 +44 (UK)</option>
                    <option value="+91">🇮🇳 +91 (India)</option>
                    <option value="+1">🇺🇸 +1 (USA)</option>
                    <option value="+61">🇦🇺 +61 (Australia)</option>
                    <option value="+81">🇯🇵 +81 (Japan)</option>
                    <option value="+49">🇩🇪 +49 (Germany)</option>
                    <option value="+33">🇫🇷 +33 (France)</option>
                    <option value="+971">🇦🇪 +971 (UAE)</option>
                    <option value="+86">🇨🇳 +86 (China)</option>
                    <option value="+92">🇵🇰 +92 (Pakistan)</option>
                </select>
                <input type="tel" placeholder="Phone Number"
                    class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm" required />
            </div>

            <!-- Password -->
            <input type="password" placeholder="Secure Password"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm" required />

            <!-- Confirm Password -->
            <input type="password" placeholder="Confirm Password"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm" required />

            <!-- Terms and Conditions -->
            <label class="text-xs flex items-start gap-2">
                <input type="checkbox" required class="mt-1" />
                <span>By Signing Up, I Agree To The <a href="#" class="text-teal-400 underline">Terms & Conditions</a>
                    and <a href="#" class="text-teal-400 underline">Privacy Policy</a> of Veltrixa.AI.</span>
            </label>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-green-400 text-black font-semibold rounded-lg py-2 hover:bg-green-500 transition">
                Initiate Entry
            </button>

            <!-- Access Link -->
            <p class="text-center text-sm text-gray-400">Already Have An Account? <a href="#"
                    class="text-green-400 hover:underline">Access Gateway</a></p>
        </form>
    </div>
</body>

</html>

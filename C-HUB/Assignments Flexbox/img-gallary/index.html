<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Responsive Image Gallery</h1>
      <p>Change Width of Window to see Effect</p>
    </div>

    <div class="row">
      <div class="column">
        <div class="image-container">
          <img src="https://picsum.photos/id/10/800/600" alt="Forest" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/11/800/600" alt="Valley" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/12/800/600" alt="Cliff" />
        </div>
      </div>

      <div class="column">
        <div class="image-container">
          <img
            src="https://picsum.photos/id/13/800/600"
            alt="Northern Lights"
          />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/14/800/600" alt="Desert" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/15/800/600" alt="Waterfall" />
        </div>
      </div>

      <div class="column">
        <div class="image-container">
          <img src="https://picsum.photos/id/16/800/600" alt="Mountain Lake" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/17/800/600" alt="Canyon" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/18/800/600" alt="Beach" />
        </div>
      </div>

      <div class="column">
        <div class="image-container">
          <img src="https://picsum.photos/id/19/800/600" alt="Sunset" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/20/800/600" alt="Farm" />
        </div>
        <div class="image-container">
          <img src="https://picsum.photos/id/21/800/600" alt="Glacier" />
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Switcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Hidden radio buttons -->
    <input type="radio" name="tab" id="tab1" />
    <input type="radio" name="tab" id="tab2" />
    <input type="radio" name="tab" id="tab3" />

    <div class="container">
      <!-- Left content area -->
      <div class="content">
        <div class="content-area content1">
          <h2>Content for Tab 1</h2>
          <p>This is the content shown when you click 1.</p>
        </div>
        <div class="content-area content2">
          <h2>Content for Tab 2</h2>
          <p>This is the content shown when you click 2.</p>
        </div>
        <div class="content-area content3">
          <h2>Content for Tab 3</h2>
          <p>This is the content shown when you click 3.</p>
        </div>
      </div>

      <!-- Right side buttons -->
      <div class="tabs">
        <label for="tab1">1</label>
        <label for="tab2">2</label>
        <label for="tab3">3</label>
      </div>
    </div>
  </body>
</html>

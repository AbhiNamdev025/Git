<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Profile Card</h1>
    </header>

    <div class="main-container">
      <div class="profile-content">
        <div class="profile-photo">
          <img src="/21july/profile_pic.png" alt="Profile Photo" />
        </div>

        <div class="user-info">
          <h2>Abhi Namdev</h2>
          <p>
            MERN stack intern passionate about building dynamic web
            applications. Eager to learn and grow in full-stack development,
            with hands-on experience in MongoDB, Express.js, React, and Node.js.
          </p>
          <div class="location">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span>Naraingarh Ambala, Haryana</span>
          </div>
        </div>

        <div class="stats">
          <div class="stat-item">
            <div class="stat-value">12.8k</div>
            <div class="stat-label">Followers</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">348</div>
            <div class="stat-label">Following</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">127</div>
            <div class="stat-label">Posts</div>
          </div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-button edit-btn">Edit Profile</button>
        <button class="nav-button message-btn">Message</button>
        <button class="nav-button follow-btn">Follow</button>
      </div>
    </div>
  </body>
</html>

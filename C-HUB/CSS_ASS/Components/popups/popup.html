<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop-Ups</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
        <!-- 1. Modal Popup -->
        <div class="component-box">
            <label for="modal" class="modal-btn">View Special Offer</label>
            <input type="checkbox" id="modal" class="modal-toggle" />
            <div class="modal">
                <div class="modal-content">
                 <form>
                    <h2>Special Offers</h2>
                    <p>Subscribe to our newsletter and get 20% off your first purchase!</p>
                    <input type="text" name="Name" id="name" placeholder="Enter your name" required>
                    <input type="email" placeholder="Enter your email" required>
                    <textarea name="Message" id="message" placeholder="Enter your message" required></textarea>
                    <button type="submit" class="modal-btn">Subscribe</button>
                 </form>
                </div>
            </div>
        </div>

        <!-- 2. Tooltip -->
        <div class="component-box">
            <div class="tooltip-container">
                <span class="info-icon">ℹ️ Info</span>
                <div class="tooltip">Contact Me : namdevabhi025@gmail.com</div>
            </div>
        </div>

        <!-- 3. Slide-in Notification -->
        <div class="slide-box">New feature: Dark mode available</div>

        <!-- 4. Hover Card -->
        <div class="component-box">
            <div class="hover-card">
                <div class="profile-preview">
                    <img src="/21july/profile_pic.png" alt="Profile" class="profile-img">
                    <span>Abhi Namdev</span>
                </div>
                <div class="card-popup">
                <img src="/21july/profile_pic.png" alt="Profile" class="profile-img">

                    <strong>Abhi Namdev</strong>
                    <p>Web Developer</p>
                </div>
            </div>
        </div>

        <!-- 5. Fullscreen Overlay -->
        <div class="component-box">
            <label for="overlay" class="overlay-btn">Quick Guide</label>
            <input type="checkbox" id="overlay" class="overlay-toggle" />
            <div class="overlay">
                <div class="overlay-content">
                   <img src="/undraw_eating-pasta_96tb.png" alt="overlayerimg" class="overlay-img">
                    <label for="overlay" class="overlay-btn close-btn">Got It</label>
                </div>
            </div>
        </div>
    </div>
</body
</html>

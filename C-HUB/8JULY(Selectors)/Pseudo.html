<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pseudo-Class</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Pseudo-Class Examples</h2>

    <!-- :hover -->
    <button class="hover-btn">Hover Over Me</button><br /><br />

    <!-- :active -->
    <a href="#" class="active-link">Click Me (Active)</a><br /><br />

    <!-- :focus -->
    <input type="text" placeholder="Click or Tab to Focus" /><br /><br />

    <!-- :visited -->
    <a href="#" target="_blank" class="visited">Visited Link</a><br /><br />

    <!-- :first-last-nth-child -->
    <ul>
      <li>First Item</li>
      <li>Second Item (nth-child)</li>
      <li>Last Item</li>
    </ul>
    <br />
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Combinators Example</title>
    <link rel="stylesheet" href="/8JULY(Combinators)/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="child">Child (Direct child of .container)</div>

      <div>
        <div class="descendant">Descendant (Not direct child)</div>
      </div>
    </div>

    <div class="title">Title Element</div>

    <div class="next-sibling">Next Sibling (Immediately after .title)</div>

    <p>Unrelated paragraph</p>

    <div class="subsequent-sibling">Subsequent Sibling 1 (After .title)</div>
    <div class="subsequent-sibling">Subsequent Sibling 2 (After .title)</div>
  </body>
</html>

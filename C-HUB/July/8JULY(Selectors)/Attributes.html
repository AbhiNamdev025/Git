<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Attribute Selector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>CSS Attribute Selectors Demo</h2>

    <p data-active>This paragraph has a data attribute.</p>

    <input type="text" placeholder="Text input" />
    <input type="email" required placeholder="Required Email" />

    <div class="note highlight">Highlight using class~="highlight"</div>

    <p lang="en-US">This text is in English (lang|="en")</p>

    <a href="https://example.com">Secure Link (starts with https)</a><br />
    <a href="manual.pdf">PDF File (ends with .pdf)</a><br />
    <a href="/user/login-form">Login Link (contains 'login')</a>
  </body>
</html>

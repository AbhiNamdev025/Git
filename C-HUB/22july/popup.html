<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop-Ups</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
        <!-- 1. Modal Popup -->
        <div class="component-box">
            <label for="modal" class="modal-btn">View Special Offer</label>
            <input type="checkbox" id="modal" class="modal-toggle" />
            <div class="modal">
                <div class="modal-content">
                    <h3>Special Offer!</h3>
                    <p>Enjoy 20% discount today</p>
                    <label for="modal" class="modal-btn close-btn">Close</label>
                </div>
            </div>
        </div>

        <!-- 2. Tooltip -->
        <div class="component-box">
            <div class="tooltip-container">
                <span class="info-icon">ℹ️ Info</span>
                <div class="tooltip">Contact Me : namdevabhi025@gmail.com</div>
            </div>
        </div>

        <!-- 3. Slide-in Notification -->
        <div class="slide-box">New feature: Dark mode available</div>

        <!-- 4. Hover Card -->
        <div class="component-box">
            <div class="hover-card">
                <div class="profile-preview">
                    <img src="/21july/profile_pic.png" alt="Profile" class="profile-img">
                    <span>Abhi Namdev</span>
                </div>
                <div class="card-popup">
                <img src="/21july/profile_pic.png" alt="Profile" class="profile-img">

                    <strong>Abhi Namdev</strong>
                    <p>Web Developer</p>
                </div>
            </div>
        </div>

        <!-- 5. Fullscreen Overlay -->
        <div class="component-box">
            <label for="overlay" class="overlay-btn">Quick Guide</label>
            <input type="checkbox" id="overlay" class="overlay-toggle" />
            <div class="overlay">
                <div class="overlay-content">
                    <h2>Welcome</h2>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Architecto, rem!</p>
                    <label for="overlay" class="overlay-btn close-btn">Got It</label>
                </div>
            </div>
        </div>
    </div>
</body
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Login & Signup Forms</title>
    <link rel="stylesheet" href="forms.css" />
  </head>
  <body>
    <h1>Multiple Login & Signup Form Styles (HTML + CSS)</h1>

    <!-- 1. Basic Login Form -->
    <h2>1. Basic Login Form</h2>
    <form class="basic-login">
      <label>Username</label>
      <input type="text" required />

      <label>Password</label>
      <input type="password" required />

      <button type="submit">Login</button>
    </form>

    <!-- 2. Card-Style Signup Form -->
    <h2>2. Card-Style Signup Form</h2>
    <form class="card-signup">
      <label>Full Name</label>
      <input type="text" required />

      <label>Email</label>
      <input type="email" required />

      <label>Password</label>
      <input type="password" required />

      <button type="submit">Sign Up</button>
    </form>

    <!-- 3. Inline Login/Signup Switch -->
    <h2>3. Inline Login/Signup Switch</h2>
    <form class="inline-switch">
      <div class="radio-group">
        <input type="radio" id="login" name="form-type" checked required />
        <label for="login">Login</label>

        <input type="radio" id="signup" name="form-type" required />
        <label for="signup">Signup</label>
      </div>
      <label for="email">Email</label>
      <input type="email" required />
      <label for="password">Password</label>
      <input type="password" required />

      <button type="submit">Submit</button>
    </form>

    <!-- 4. Minimalist Login -->
    <h2>4. Minimalist Login</h2>
    <form class="minimalist-login">
      <label for="email">Email</label>
      <input type="email" required />
      <label for="password">Password</label>
      <input type="password" required />

      <button type="submit">Login</button>
    </form>

    <!-- 5. Split Panel Login & Signup -->
    <h2>5. Split Panel Login & Signup</h2>
    <div class="split-panel">
      <div class="panel left">
        <h3>Login</h3>
        <input type="text" placeholder="Username" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </div>
      <div class="panel right">
        <h3>Signup</h3>
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>दिनचर्या</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>दिनचर्या</h1>
      <div class="newTask">
        <input type="text" placeholder="Task To Be Done.." id="text-input" />
        <button class="add">Add</button>
      </div>
      <div class="tasks"></div>
    </div>
    <div class="popup">
      <div class="popups">
        <div class="success">Task Added✅</div>
        <div class="error">Please Enter A Task ⚠️</div>
        <div class="deleted">Deleted Successfully🚮</div>
          <div class="edit">Edited Successfully✏️</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
